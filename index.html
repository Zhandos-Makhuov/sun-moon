<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15153a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Солнце и Луна</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--sun:#ffc24a;--sun2:#ff9a2e;--moon:#b4c2ff;--moon2:#7d6cf0;--ink:#f4f1ff;--bg:#15153a;--panel:rgba(24,22,60,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* top bar */
#bar{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:999px;background:rgba(20,18,50,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#bar button{width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.1);font-size:16px;line-height:32px;padding:0}
#bar button:hover{background:rgba(255,255,255,.2)}
#bar button.off{opacity:.45}
#lvlName{font-weight:800;font-size:14px;padding:0 8px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}

/* hint */
#hint{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(640px,calc(100vw - 340px));min-width:220px;padding:8px 16px;border-radius:16px;background:rgba(20,18,50,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:14px;font-weight:600;line-height:1.35;text-align:center;z-index:4;transition:opacity .8s;pointer-events:auto}
#hint.fade{opacity:0;pointer-events:none}
body:not(.touch) #hint{max-width:min(680px,90vw)}
body.touch #hint{font-size:12px;padding:6px 12px;max-width:calc(100vw - 300px)}

/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;padding:12px;background:radial-gradient(ellipse at center,rgba(15,12,40,.15),rgba(10,8,30,.55))}
.card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:28px;padding:22px 26px;max-width:760px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);text-align:center;touch-action:pan-y}
.card.small{max-width:420px}
h1{margin:4px 0 0;font-size:clamp(28px,5vw,44px);font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#ffd76e,#ff9f45 35%,#c6b8ff 65%,#8fa6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 8px;font-size:28px;font-weight:900}
.sub{margin:4px 0 16px;opacity:.8;font-weight:600}
.logo{display:flex;justify-content:center;gap:14px;height:46px;align-items:center}
.logo i{display:block;width:40px;height:40px;border-radius:50%}
.logo .ls{background:radial-gradient(circle at 38% 35%,#fff8c8,#ffc848 55%,#ff9a2e);box-shadow:0 0 24px 6px rgba(255,190,70,.55);animation:bob 3s ease-in-out infinite}
.logo .lm{background:radial-gradient(circle at 38% 35%,#ffffff,#d3dcff 55%,#9aaaf0);box-shadow:0 0 24px 6px rgba(150,170,255,.5);animation:bob 3s ease-in-out infinite -1.5s}
@keyframes bob{50%{transform:translateY(-6px)}}
#levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:6px 0 14px}
.lv{position:relative;border:0;border-radius:18px;padding:10px 4px 8px;background:linear-gradient(160deg,rgba(255,214,120,.18),rgba(140,150,255,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:transform .15s,background .15s}
.lv:hover:not(:disabled){transform:translateY(-2px);background:linear-gradient(160deg,rgba(255,214,120,.3),rgba(140,150,255,.3))}
.lv b{display:block;font-size:22px;font-weight:900}
.lv>span{display:block;font-size:11px;opacity:.8;min-height:2.6em;line-height:1.3;padding:0 2px}
.lv em{font-style:normal;font-size:14px;letter-spacing:1px;color:#ffd76e}
.lv em .e{color:rgba(255,255,255,.22)}
.lv:disabled{opacity:.38;cursor:default}
.help{font-size:13px;opacity:.85;line-height:1.5}
.help kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:6px;background:rgba(255,255,255,.14);font-family:inherit;font-weight:800}
.bigstars{font-size:46px;letter-spacing:6px;margin:4px 0;color:#ffd76e;text-shadow:0 0 18px rgba(255,200,80,.6)}
.bigstars .e{color:rgba(255,255,255,.18);text-shadow:none}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btns button{border:0;border-radius:999px;padding:10px 18px;font-weight:800;background:rgba(255,255,255,.12)}
.btns button.primary{background:linear-gradient(90deg,#ffc24a,#ff9a2e);color:#3a2200}
.btns button:hover{filter:brightness(1.1)}

/* toast */
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.9);padding:12px 22px;border-radius:999px;background:rgba(20,18,50,.82);font-weight:800;font-size:20px;z-index:6;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* touch pads */
#pads{position:fixed;inset:0;pointer-events:none;display:none;z-index:3}
body.touch.playing #pads{display:block}
.pad{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));width:124px;height:124px}
.pad.l{left:calc(8px + env(safe-area-inset-left))}
.pad.r{right:calc(8px + env(safe-area-inset-right))}
.tb{position:absolute;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;pointer-events:auto;touch-action:none;transition:transform .06s,background .1s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.tb.sun{background:rgba(255,196,80,.22);box-shadow:inset 0 0 0 2px rgba(255,205,110,.55);color:#ffe6a6}
.tb.moon{background:rgba(160,175,255,.2);box-shadow:inset 0 0 0 2px rgba(175,185,255,.55);color:#dfe4ff}
.tb.on{transform:scale(.9)}
.tb.sun.on{background:rgba(255,196,80,.55)}
.tb.moon.on{background:rgba(160,175,255,.5)}
#pads.noab .tb[data-k$="A"]{display:none}

#rotate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:20px;padding:20px}
#rotate div{font-size:64px;animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait){body.touch #rotate{display:flex}}
@media (max-height:420px){.card{padding:12px 16px;border-radius:20px}.logo{height:30px}.logo i{width:26px;height:26px}h1{font-size:26px}.sub{margin:2px 0 8px;font-size:13px}#levels{gap:6px;margin:4px 0 8px}.lv{padding:5px 2px 4px;border-radius:12px}.lv b{font-size:17px}.lv span{font-size:10px;min-height:2.4em}.help{font-size:11px}.bigstars{font-size:34px}h2{font-size:22px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar" class="hidden">
  <button id="bMenu" title="Меню (Esc)" aria-label="Меню">☰</button>
  <span id="lvlName"></span>

  <button id="bRestart" title="Заново (R)" aria-label="Заново">↻</button>

</div>
<div id="hint" class="fade"></div>

<div id="pads">

    <div class="tb sun" data-k="sA" style="left:0;top:0">✦</div>

    <div class="tb moon" data-k="mA" style="left:66px;top:0">✦</div>
    <div class="tb moon" data-k="mL" style="left:0;top:66px">◀</div>
    <div class="tb moon" data-k="mR" style="left:66px;top:66px">▶</div>
  </div>
</div>

<div id="menu" class="screen">
  <div class="card">
    <div class="logo"><i class="ls"></i><i class="lm"></i></div>
    <h1>Солнце и Луна</h1>
    <p class="sub">Кооперативный платформер для двоих</p>
    <div id="levels"></div>
    <div class="help" id="help"></div>
  </div>
</div>

<div id="win" class="screen hidden">
  <div class="card small">
    <h2 id="winTitle">Уровень пройден!</h2>
    <div id="winStars" class="bigstars"></div>
    <p id="winInfo"></p>
    <div class="btns">
      <button id="wNext" class="primary">Дальше</button>
      <button id="wAgain">Ещё раз</button>
      <button id="wMenu">Меню</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="rotate"><div>📱</div><p>Поверните телефон горизонтально</p></div>

/* ================= DOM / canvas ================= */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const lc = document.createElement('canvas'); lc.width = 160; lc.height = 90;
const lctx = lc.getContext('2d');
const tilesCv = document.createElement('canvas'); tilesCv.width = W * 2; tilesCv.height = H * 2;
let sc = 1, ox = 0, oy = 0, dpr = 1;

const params = new URLSearchParams(location.search);
let isTouch = matchMedia('(pointer: coarse)').matches;
function setTouch(v) { isTouch = v; document.body.classList.toggle('touch', v); buildHelp(); resize(); if (lvl && state !== 'menu') showHint(); }

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  // на сенсорных экранах оставляем по бокам место под кнопки
  const side = isTouch ? Math.min(118, innerWidth * 0.14) * dpr : 0;
  sc = Math.min((cv.width - 2 * side) / W, cv.height / H);
  ox = (cv.width - W * sc) / 2; oy = (cv.height - H * sc) / 2;
}
addEventListener('resize', resize); resize();

/* ================= save ================= */
let save = { unlocked: 1, stars: [] };
try { const s = JSON.parse(localStorage.getItem('sun-moon.v1')); if (s) save = Object.assign(save, s); } catch (e) {}
if (params.has('all')) save.unlocked = LEVELS.length;
function persist() { try { localStorage.setItem('sun-moon.v1', JSON.stringify(save)); } catch (e) {} }

try { muted = localStorage.getItem('sun-moon.mute') === '1'; } catch (e) {}

/* ================= state ================= */

/* ================= world queries ================= */
function active(link) { return !!sig[link]; }
function ambient() {
  if (!lvl.cycle) return lvl.ambient;
  const { day, night } = lvl.cycle, p = time % (day + night);
  return p < day ? 1 : -1;
}
function ambientMix() { // 1 = день, 0 = ночь (для отрисовки)
  if (!lvl.cycle) return lvl.ambient > 0 ? 1 : 0;
  const { day, night } = lvl.cycle, P = day + night, p = time % P;
  if (time < 0.5) return 1;
  let s;
  if (p < 0.5) s = 0.5 + p;
  else if (p < day - 0.5) s = 1;
  else if (p < day + 0.5) s = 1 - (p - (day - 0.5));
  else if (p < P - 0.5) s = 0;
  else s = p - (P - 0.5);
  return Math.max(0, Math.min(1, s));
}
function effK(e) { return Math.min(1, e.t / 0.25) * Math.min(1, (e.dur - e.t) / 0.4); }
function lightAt(x, y) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i], r = e.r * effK(e);
    if ((x - e.x) ** 2 + (y - e.y) ** 2 < r * r) return e.type;
  }
  for (const c of clouds) if (active(c.link) && inRect(x, y, c)) return -1;
  for (const l of lamps) if ((!l.link || active(l.link)) && (x - l.x) ** 2 + (y - l.y) ** 2 < l.r * l.r) return 1;
  for (let i = zones.length - 1; i >= 0; i--) if (inRect(x, y, zones[i])) return zones[i].t;
  return ambient();
}
function solidTile(c, r, kind) {
  if (c < 0 || c >= COLS) return true;
  if (r < 0 || r >= ROWS) return false;
  const ch = grid[r][c];
  return ch === '#' || (ch === '+' && kind === 'sun') || (ch === 'x' && kind === 'moon');
}
function solidsNear(h) {
  const out = [];
  const c0 = Math.floor(h.x / T) - 1, c1 = Math.floor((h.x + h.w) / T) + 1;
  const r0 = Math.floor(h.y / T) - 1, r1 = Math.floor((h.y + h.h) / T) + 1;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solidTile(c, r, h.kind)) out.push(rect(c * T, r * T, T, T));
  for (const g of gates) { const gh = g.h * (1 - g.open); if (gh > 2) out.push({ x: g.x, y: g.y, w: g.w, h: gh, dyn: true }); }
  for (const b of bridges) if (b.on) out.push({ x: b.x, y: b.y, w: b.w, h: b.h, dyn: true });

}
const center = h => [h.x + h.w / 2, h.y + h.h / 2];
function eclipseOn() {
  if (!lvl.eclipse) return false;
  const [ax, ay] = center(heroes[0]), [bx, by] = center(heroes[1]);
  return Math.hypot(ax - bx, ay - by) < ECLIPSE_DIST;
}

/* ================= simulation ================= */
function step(dt) {
  // particles & animations always run
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; }
  particles = particles.filter(p => p.life > 0);
  for (const g of gates) g.open += ((active(g.link) ? 1 : 0) - g.open) * Math.min(1, dt * 10);
  for (const b of bridges) b.a += ((b.on ? 1 : 0) - b.a) * Math.min(1, dt * 10);
  for (const l of levers) l.a += ((l.on ? 1 : 0) - l.a) * Math.min(1, dt * 12);
  for (const l of lamps) if (l.link) l.a += ((active(l.link) ? 1 : 0) - l.a) * Math.min(1, dt * 6);
  for (const c of clouds) c.a += ((active(c.link) ? 1 : 0) - c.a) * Math.min(1, dt * 4);

  if (state === 'fail') { failT -= dt; if (failT <= 0) restart(); return; }
  if (state === 'won') { wonT += dt; if (Math.random() < 0.3) spawnConfetti(); return; }
  if (state !== 'play') return;

  time += dt;

  // day / night switch
  const amb = ambient();
  if (amb !== lastAmb) { lastAmb = amb; sfx.cycle(amb > 0); toast(amb > 0 ? '☀ Наступил день' : '☾ Наступила ночь', 1200); }

  // signals: buttons (momentary) + levers (toggle)
  const prev = sig; sig = {};
  for (const b of buttons) {
    const was = b.down;
    b.down = heroes.some(h => ov(h, b));
    if (b.down && !was) sfx.button();
    if (b.down) sig[b.link] = true;
  }
  for (const l of levers) if (l.on) sig[l.link] = true;
  for (const b of bridges) b.on = active(b.link);

  // own light effects
  for (const e of effects) e.t += dt;
  effects = effects.filter(e => e.t < e.dur);

  for (let i = 0; i < 2; i++) updateHero(heroes[i], heroes[1 - i], dt, i);
  for (const k in queued) queued[k] = false;
  if (state !== 'play') return;

  // levers
  for (const l of levers) {
    const box = rect(l.x + 5, l.y + 2, T - 10, T - 2);
    heroes.forEach((h, i) => {
      const t = ov(h, box);
      if (t && !l.touching[i]) { l.on = !l.on; sfx.lever(); burst(l.x + T / 2, l.y + 8, LINK_C[l.link] || '#fff', 8); }
      l.touching[i] = t;
    });
  }

  // collectibles
  for (const it of items) {
    if (it.got) continue;
    const h = heroes[it.kind === 'sun' ? 0 : 1];
    const [hx, hy] = center(h);
    if (Math.hypot(hx - it.x, hy - it.y) < 22) {
      it.got = true; h.collected++;
      it.kind === 'sun' ? sfx.ray() : sfx.star();
      burst(it.x, it.y, it.kind === 'sun' ? '#ffd76e' : '#cfd7ff', 14);
    }
  }

  // light / energy
  const ecl = eclipseOn();
  for (const h of heroes) {
    const [hx, hy] = center(h);
    const l = lightAt(hx, hy);
    const safe = ecl || (h.kind === 'sun' ? l > 0 : l < 0);
    h.hostile = !safe;
    h.energy = safe ? Math.min(1, h.energy + REGEN * dt) : h.energy - DRAIN * dt;
    if (!safe && Math.random() < dt * 14) particles.push({ x: hx + (Math.random() - .5) * 20, y: hy + (Math.random() - .5) * 20, vx: 0, vy: -20, life: .6, max: .6, size: 2, color: h.kind === 'sun' ? 'rgba(255,200,120,1)' : 'rgba(200,210,255,1)' });
    if (h.energy <= 0) { h.energy = 0; fail(h.kind === 'sun' ? 'Солнце погасло…' : 'Луна растаяла в свете…', h); return; }
  }

  // doors
  for (const h of heroes) { const [hx, hy] = center(h); h.atDoor = inRect(hx, hy, doors[h.kind]); }
  if (heroes[0].atDoor && heroes[1].atDoor) { winT += dt; if (winT > 0.35) win(); } else winT = 0;
}

function updateHero(h, other, dt, idx) {
  const p = idx === 0 ? 's' : 'm';
  const dir = (inp(p + 'R') ? 1 : 0) - (inp(p + 'L') ? 1 : 0);
  const a = h.onGround ? ACC : AIR_ACC, target = dir * SPEED;
  if (h.vx < target) h.vx = Math.min(target, h.vx + a * dt); else if (h.vx > target) h.vx = Math.max(target, h.vx - a * dt);
  if (dir) h.face = dir;

  if (queued[p + 'J']) h.jumpBuf = BUFFER;
  h.jumpBuf -= dt;
  h.coyote = h.onGround ? COYOTE : h.coyote - dt;
  if (h.jumpBuf > 0 && h.coyote > 0) {
    h.vy = -JUMP_V; h.jumpBuf = 0; h.coyote = 0; h.onGround = false; h.squash = -0.25;
    sfx.jump(h.kind); puff(h.x + h.w / 2, h.y + h.h, h.kind);
  }
  const held = inp(p + 'J');
  h.vy = Math.min(MAX_FALL, h.vy + GRAV * (h.vy < 0 && !held ? 2.3 : 1) * dt);

  // ability
  h.cd = Math.max(0, h.cd - dt);
  if (queued[p + 'A'] && lvl.ability && h.cd <= 0) {
    const [cx, cy] = center(h);
    effects.push({ type: h.kind === 'sun' ? 1 : -1, x: cx, y: cy, r: AB_R, t: 0, dur: AB_DUR, kind: h.kind });
    h.cd = AB_CD; sfx.ability(h.kind);
  }

  // move & collide
  const sol = solidsNear(h);
  const ign = sol.map(r => r.dyn && ov(h, r));
  h.x += h.vx * dt;
  for (let i = 0; i < sol.length; i++) {
    if (ign[i] || !ov(h, sol[i])) continue;
    const r = sol[i];
    if (h.vx > 0) h.x = r.x - h.w; else if (h.vx < 0) h.x = r.x + r.w;
    h.vx = 0;
  }
  const wasGround = h.onGround, vyBefore = h.vy, prevBottom = h.y + h.h;
  h.y += h.vy * dt;
  h.onGround = false;
  for (let i = 0; i < sol.length; i++) {
    if (ign[i] || !ov(h, sol[i])) continue;
    const r = sol[i];
    if (h.vy >= 0) { h.y = r.y - h.h; h.onGround = true; } else h.y = r.y + r.h;
    h.vy = 0;
  }
  // stand on partner's head
  if (h.vy >= 0 && prevBottom <= other.y + 0.5 && h.y + h.h > other.y && h.x < other.x + other.w - 2 && h.x + h.w > other.x + 2) {
    h.y = other.y - h.h; h.vy = 0; h.onGround = true;
  }
  if (h.y < -80) { h.y = -80; h.vy = Math.max(0, h.vy); }
  if (h.onGround && !wasGround && vyBefore > 250) { h.squash = Math.min(0.35, vyBefore / 2000); puff(h.x + h.w / 2, h.y + h.h, h.kind); }
  h.squash *= Math.pow(0.0001, dt);
  h.blink -= dt; if (h.blink < -0.12) h.blink = 2 + Math.random() * 3;

}

function fail(msg, h) {
  if (state !== 'play') return;
  state = 'fail'; failT = 1.6;
  sfx.fail(); toast(msg, 1500);
  const [hx, hy] = center(h);
  burst(hx, Math.min(hy, H - 10), h.kind === 'sun' ? '#ffcf70' : '#c9d2ff', 24);
}
function rating() {

function win() {

  save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, cur + 2));

const TILE_STYLE = {

  'x': { base: '#8f79ec', top: '#cfc2ff', bottom: 'rgba(40,20,120,.3)', glow: 'rgba(140,110,255,.85)' },

function renderTiles() {

  g.setTransform(2, 0, 0, 2, 0, 0);

  for (const ch of ['#', '+', 'x']) {
    const st = TILE_STYLE[ch];
    const same = (c, r) => r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === ch;
    const path = new Path2D(), tops = new Path2D();
    let any = false;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (grid[r][c] !== ch) continue;
      any = true;
      const up = same(c, r - 1), dn = same(c, r + 1), lf = same(c - 1, r), rt = same(c + 1, r);
      const R = 9;
      const x = c * T - (lf ? 0.5 : 0), y = r * T - (up ? 0.5 : 0);
      const w = T + (lf ? 0.5 : 0) + (rt ? 0.5 : 0), hh = T + (up ? 0.5 : 0) + (dn ? 0.5 : 0);
      rr(path, x, y, w, hh, [!up && !lf ? R : 0, !up && !rt ? R : 0, !dn && !rt ? R : 0, !dn && !lf ? R : 0]);
      if (!up) rr(tops, c * T + (lf ? -0.5 : 3), r * T + 2, T - (lf ? -0.5 : 3) - (rt ? -0.5 : 3), 5, [lf ? 0 : 3, rt ? 0 : 3, 3, 3]);
    }

    g.fillStyle = st.base; g.fill(path);
    g.restore();

    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (grid[r][c] !== ch || same(c, r + 1)) continue;
      const gr = g.createLinearGradient(0, r * T + 10, 0, r * T + T);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, st.bottom);
      g.fillStyle = gr; g.fillRect(c * T, r * T, T, T);

}

  const gr = ctx.createRadialGradient(-4, -5, 1, 0, 0, R);
  if (sun) { gr.addColorStop(0, '#fffbd8'); gr.addColorStop(0.55, '#ffc84a'); gr.addColorStop(1, '#ff9a2e'); }
  else { gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.6, '#d4dcff'); gr.addColorStop(1, '#9aa8ee'); }
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  if (!sun) {
    ctx.fillStyle = 'rgba(130,140,210,.35)';
    ctx.beginPath(); ctx.arc(5, 5, 3, 0, 7); ctx.arc(-6, 4, 2, 0, 7); ctx.arc(2, -7, 2.2, 0, 7); ctx.fill();
  }
  // dimming
  if (e < 1) { ctx.fillStyle = `rgba(40,36,80,${(1 - e) * 0.6})`; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill(); }
  // face
  ctx.globalAlpha = 1;
  const fx = h.face * 2.5, closed = h.blink < 0;
  ctx.fillStyle = sun ? '#7a3b00' : '#3b3a7a';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    if (closed) { ctx.ellipse(fx + s * 4.5, -1, 2.2, 0.8, 0, 0, 7); }
    else { ctx.ellipse(fx + s * 4.5, -1.5, 1.8, h.hostile ? 1.6 : 2.6, 0, 0, 7); }
    ctx.fill();
  }
  ctx.fillStyle = sun ? 'rgba(255,120,80,.45)' : 'rgba(200,140,220,.4)';
  ctx.beginPath(); ctx.arc(fx - 7, 3.5, 2.2, 0, 7); ctx.arc(fx + 7, 3.5, 2.2, 0, 7); ctx.fill();
  ctx.strokeStyle = sun ? '#7a3b00' : '#3b3a7a'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath();
  if (h.hostile) ctx.arc(fx, 6.5, 2.2, Math.PI * 1.15, Math.PI * 1.85); else ctx.arc(fx, 2.5, 2.6, 0.2 * Math.PI, 0.8 * Math.PI);
  ctx.stroke();
  ctx.restore();
  // energy ring
  if (e < 0.995) {
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(20,20,50,.35)'; ctx.beginPath(); ctx.arc(cx, cy, R + 7, 0, 7); ctx.stroke();
    ctx.strokeStyle = e < 0.35 ? '#ff7a7a' : sun ? '#ffd36b' : '#c3ccff';
    ctx.beginPath(); ctx.arc(cx, cy, R + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * e); ctx.stroke();
  }
}

/* ================= HUD ================= */
function renderHUD() {
  const both = [heroes[0], heroes[1]];
  both.forEach((h, i) => {
    const sun = i === 0, w = 214, hgt = 28, x = sun ? 8 : W - 8 - w, y = 6;
    ctx.fillStyle = 'rgba(20,18,50,.5)'; ctx.beginPath(); rr(ctx, x, y, w, hgt, 14); ctx.fill();
    // icon
    const ix = sun ? x + 16 : x + w - 16, iy = y + 14;
    const gr = ctx.createRadialGradient(ix - 2, iy - 2, 1, ix, iy, 8);
    if (sun) { gr.addColorStop(0, '#fff6c8'); gr.addColorStop(1, '#ffa83a'); } else { gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#9aa8ee'); }
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(ix, iy, 8, 0, 7); ctx.fill();
    // energy bar
    const bw = 80, bx = sun ? x + 30 : x + w - 30 - bw, by = y + 10;
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.beginPath(); rr(ctx, bx, by, bw, 8, 4); ctx.fill();
    const e = Math.max(0, h.energy);
    ctx.fillStyle = e < 0.35 ? '#ff8080' : sun ? '#ffd36b' : '#c3ccff';
    if (e > 0.02) { ctx.beginPath(); rr(ctx, sun ? bx : bx + bw * (1 - e), by, bw * e, 8, 4); ctx.fill(); }
    // collected
    const total = items.filter(it => it.kind === h.kind).length;
    ctx.font = '800 13px Nunito, system-ui, sans-serif'; ctx.textBaseline = 'middle';
    const tx = sun ? bx + bw + 10 : bx - 10;
    ctx.textAlign = sun ? 'left' : 'right';
    if (total) {
      const ex = sun ? tx + 6 : tx - 6;
      ctx.fillStyle = sun ? '#ffe07a' : '#e6eaff';
      starPath(ctx, ex, iy, sun ? 4 : 5, 6, sun ? 2 : 2.8, 0); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillText(`${h.collected}/${total}`, sun ? ex + 9 : ex - 9, iy + 1);
    }
    // ability
    if (lvl.ability) {
      const ax = sun ? x + w - 15 : x + 15;
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(ax, iy, 9, 0, 7); ctx.fill();
      const k = 1 - h.cd / AB_CD;
      ctx.fillStyle = h.cd <= 0 ? (sun ? '#ffd36b' : '#a493ff') : 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.moveTo(ax, iy); ctx.arc(ax, iy, 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.closePath(); ctx.fill();
      if (h.cd <= 0) { ctx.fillStyle = sun ? '#7a3b00' : '#fff'; ctx.font = '900 10px Nunito, system-ui'; ctx.textAlign = 'center'; ctx.fillText('✦', ax, iy + 1); }
    }
  });
  // day/night dial
  if (lvl.cycle) {
    const { day, night } = lvl.cycle, P = day + night, p = time % P, isDay = p < day;
    const left = isDay ? day - p : P - p, frac = isDay ? p / day : (p - day) / night;
    const x = W / 2, y = 60, warn = left < 1.5 && state === 'play';
    ctx.fillStyle = 'rgba(20,18,50,.55)'; ctx.beginPath(); ctx.arc(x, y, 17, 0, 7); ctx.fill();
    ctx.strokeStyle = warn && Math.sin(animT * 18) > 0 ? '#ff8f8f' : isDay ? '#ffd36b' : '#b7c1ff';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y, 15, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - frac)); ctx.stroke();
    if (isDay) { ctx.fillStyle = '#ffcf5a'; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#e6eaff'; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); ctx.fillStyle = '#2b2a5e'; ctx.beginPath(); ctx.arc(x + 3.5, y - 2.5, 6, 0, 7); ctx.fill(); }
  }
}

/* ================= menu background ================= */
function renderMenuBg() {
  ctx.save();
  ctx.beginPath(); rr(ctx, 0, 0, W, H, 14); ctx.clip();
  const gr = ctx.createLinearGradient(0, 0, W, 0);
  gr.addColorStop(0, mix(DAY, DAY, 0)); gr.addColorStop(0.42, mix(DAY, NIGHT, 0.15)); gr.addColorStop(0.58, mix(NIGHT, DAY, 0.15)); gr.addColorStop(1, mix(NIGHT, NIGHT, 0));
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 50; i++) {
    const x = W * 0.55 + ((i * 97) % 430), y = (i * 53) % H, tw = 0.5 + 0.5 * Math.sin(animT * 2 + i);
    ctx.fillStyle = `rgba(235,240,255,${0.2 + 0.6 * tw})`; ctx.beginPath(); ctx.arc(x, y, 1 + (i % 3) * 0.5, 0, 7); ctx.fill();
  }
  glow(ctx, W * 0.25, H * 0.5, 160, 'rgba(255,220,130,A)', 0.5);
  glow(ctx, W * 0.75, H * 0.5, 160, 'rgba(170,185,255,A)', 0.35);
  ctx.restore();
}

/* ================= loop ================= */
let last = performance.now(), accum = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  animT += dt;
  if (lvl && state !== 'menu') { accum += dt; while (accum >= STEP) { step(STEP); accum -= STEP; } }
  else accum = 0;
  render(dt);
  requestAnimationFrame(frame);
}

// test hook
window.__sunmoon = { load, get state() { return state; }, get heroes() { return heroes; }, get items() { return items; }, lightAt: (x, y) => lightAt(x, y), LEVELS };

setTouch(isTouch);
buildMenu();
if (params.has('level')) { const n = Math.max(1, Math.min(LEVELS.length, +params.get('level') || 1)); save.unlocked = Math.max(save.unlocked, n); load(n - 1); }
requestAnimationFrame(frame);
})();
</script>
